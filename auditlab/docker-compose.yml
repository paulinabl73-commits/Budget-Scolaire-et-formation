# AuditLab — lancement complet : docker compose up -d --build
# Interface : http://localhost:8080   API : http://localhost:8080/api/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auditlab
      POSTGRES_USER: auditlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auditlab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditlab -d auditlab"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Stockage compatible S3 des pièces jointes et rapports, chiffré au repos (SSE, NF-06).
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-auditlab}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-auditlab-minio}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-auditlab-key:IyqsU3kMFloCNup4BsZtf/rmfHVcTgznO2F25CkEH1g=}
    volumes:
      - files:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      AUDITLAB_DATABASE_URL: postgresql+psycopg://auditlab:${POSTGRES_PASSWORD:-auditlab}@db:5432/auditlab
      AUDITLAB_CORS_ORIGINS: '["http://localhost:8080"]'
      AUDITLAB_SECRET_KEY: ${AUDITLAB_SECRET_KEY:-dev-change-me-00000000000000000000000000000000}
      AUDITLAB_STORAGE_BACKEND: s3
      AUDITLAB_S3_ENDPOINT: http://minio:9000
      AUDITLAB_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-auditlab}
      AUDITLAB_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-auditlab-minio}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${AUDITLAB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  files:
