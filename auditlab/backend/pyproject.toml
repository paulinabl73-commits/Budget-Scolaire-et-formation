[project]
name = "auditlab-backend"
version = "0.1.0"
description = "AuditLab — API métier (gestion des audits et analyse de données)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "duckdb>=1.1,<2",
    "polars>=1.9,<2",
    "pyarrow>=17",
    "fastexcel>=0.12",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "charset-normalizer>=3.3",
    "celery[redis]>=5.4,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]
# Analyses : SQL composé d'identifiants cités (quote_ident) ; les valeurs passent en paramètres.
"app/analytics/operations/*" = ["S608"]
