# NF-09 : connexions persistantes vers l'API (pas de nouvelle connexion TCP par requête).
upstream backend_api {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 100m;  # AUD-15 : pièces jointes jusqu'à 100 Mo

    # NF-09 : réponses JSON et ressources compressées.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Ressources versionnées par Vite (nom avec empreinte) : cache long. « expires » seul, pour
    # conserver les en-têtes de sécurité du serveur (un add_header ici les remplacerait).
    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri /index.html;
    }
}
