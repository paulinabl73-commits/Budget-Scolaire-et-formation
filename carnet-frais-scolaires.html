<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carnet des frais scolaires</title>
<style>
  :root{
    --navy:#1B2A4A; --paper:#FBF7ED; --ink:#2B2B2B; --muted:#8A8272;
    --line:#D8CFB8; --gold:#C9A227;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:Georgia,'Times New Roman',serif;}
  .sans{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  .mono{font-family:'Courier New',monospace;}
  header{background:var(--navy); color:#fff; padding:22px 18px 16px;}
  header .eyebrow{color:var(--gold); font-size:12px; letter-spacing:.12em; text-transform:uppercase;}
  header h1{margin:4px 0 2px; font-size:22px;}
  header p{margin:0; color:#B8C2D6; font-size:14px;}
  nav{display:flex; overflow-x:auto; background:var(--navy); padding:0 10px;}
  nav button{
    font-family:inherit; border:none; background:transparent; color:#B8C2D6;
    padding:12px 16px; font-size:14px; cursor:pointer; white-space:nowrap; border-radius:8px 8px 0 0;
  }
  nav button.active{background:var(--paper); font-weight:700;}
  main{padding:18px; padding-bottom:70px; max-width:640px; margin:0 auto;}
  .card{background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08);}
  label.field{display:block; margin-bottom:10px;}
  label.field span{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
  input[type=text], input[type=number]{
    width:100%; border:none; border-bottom:1px solid var(--line); background:transparent;
    font-family:inherit; font-size:14px; color:var(--ink); padding:6px 0; outline:none;
  }
  input[type=text]:focus, input[type=number]:focus{border-bottom:2px solid var(--navy);}
  .rubrique{display:flex; align-items:center; gap:10px;}
  .rubrique .label{flex:1; font-size:14px; font-weight:600;}
  .rubrique input[type=number]{width:100px; text-align:right;}
  .rubrique .detail{width:100%; margin-top:8px; font-size:12px; color:var(--muted);}
  .del{background:none; border:none; color:#B33A3A; cursor:pointer; font-size:16px; padding:0 4px;}
  .add-btn{
    width:100%; padding:10px; border:1px dashed var(--navy); background:transparent; color:var(--navy);
    border-radius:10px; font-family:inherit; font-size:14px; cursor:pointer; margin-top:6px;
  }
  .total-box{display:flex; justify-content:space-between; align-items:center; border-radius:12px; padding:14px; margin-top:14px;}
  .total-box .amount{font-size:20px; font-weight:700;}
  .resume-total{background:var(--navy); color:#fff; border-radius:12px; padding:16px; margin-bottom:14px;}
  .resume-total p{margin:0; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#B8C2D6;}
  .resume-total .amount{font-size:26px; font-weight:700; margin-top:4px;}
  .bar-row{margin-bottom:10px;}
  .bar-row .top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;}
  .bar-track{background:#F1ECDD; border-radius:6px; height:10px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:6px;}
  table{width:100%; border-collapse:collapse; font-size:12px;}
  th,td{padding:6px 4px; text-align:right; border-top:1px solid #F1ECDD;}
  th:first-child, td:first-child{text-align:left;}
  thead th{background:#F1ECDD; font-size:11px;}
  tfoot td{font-weight:700; background:#F1ECDD;}
  footer{position:fixed; bottom:0; left:0; right:0; background:var(--navy); color:#B8C2D6;
    padding:8px 16px; display:flex; justify-content:space-between; font-size:12px;}
  footer button{background:none; border:none; color:#B8C2D6; font-family:inherit; font-size:12px; cursor:pointer;}
</style>
</head>
<body>

<header>
  <div class="eyebrow sans">Année scolaire</div>
  <h1>Carnet des frais scolaires</h1>
  <p class="sans">Élie · Sarah · Talia · Noah</p>
</header>

<nav id="tabs"></nav>
<main id="main"></main>

<footer>
  <span class="sans" id="save-status">Enregistré sur cet appareil</span>
  <button class="sans" onclick="resetAll()">↺ Réinitialiser</button>
</footer>

<script>
const CHILDREN = [
  { id:"ELIE", name:"Élie", accent:"#B33A3A", soft:"#F3E2E0" },
  { id:"SARAH", name:"Sarah", accent:"#5F7A52", soft:"#E4EAE0" },
  { id:"TALIA", name:"Talia", accent:"#B8860B", soft:"#F1E7D0" },
  { id:"NOAH", name:"Noah", accent:"#2C4770", soft:"#DEE4EE" },
];

const RUBRIQUES = [
  { key:"scolarite", label:"Frais de scolarité" },
  { key:"inscription", label:"Inscription / réinscription" },
  { key:"hebergement", label:"Hébergement / internat" },
  { key:"avion", label:"Billet d'avion" },
  { key:"taxi", label:"Taxi / transport local" },
  { key:"fourniture", label:"Fourniture scolaire" },
  { key:"uniforme", label:"Uniforme / tenue" },
  { key:"assurance", label:"Assurance santé" },
  { key:"medical", label:"Frais médicaux" },
  { key:"poche", label:"Argent de poche" },
  { key:"activites", label:"Activités extrascolaires" },
];

const STORAGE_KEY = "carnet-frais-scolaires-v1";

function emptyChild(){
  const items = {};
  RUBRIQUES.forEach(r => items[r.key] = { detail:"", montant:"" });
  return { ecole:"", lieu:"", niveau:"", items, custom:[] };
}
function emptyState(){
  const s = {};
  CHILDREN.forEach(c => s[c.id] = emptyChild());
  return s;
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return emptyState();
    const parsed = JSON.parse(raw);
    const merged = emptyState();
    CHILDREN.forEach(c => {
      if(parsed[c.id]){
        merged[c.id] = Object.assign(emptyChild(), parsed[c.id]);
        merged[c.id].items = Object.assign(emptyChild().items, parsed[c.id].items || {});
      }
    });
    return merged;
  }catch(e){ return emptyState(); }
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    document.getElementById("save-status").textContent = "Enregistré sur cet appareil";
  }catch(e){
    document.getElementById("save-status").textContent = "Échec de l'enregistrement";
  }
}
function fmt(n){
  const v = Number(n) || 0;
  return v.toLocaleString("fr-FR") + " FCFA";
}
function childTotal(cd){
  let t = 0;
  RUBRIQUES.forEach(r => t += Number(cd.items[r.key]?.montant) || 0);
  (cd.custom||[]).forEach(c => t += Number(c.montant) || 0);
  return t;
}

let state = load();
let activeTab = "ELIE";

function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  CHILDREN.forEach(c => {
    const btn = document.createElement("button");
    btn.textContent = c.name;
    btn.className = activeTab === c.id ? "active" : "";
    btn.style.color = activeTab === c.id ? c.accent : "";
    btn.onclick = () => { activeTab = c.id; render(); };
    nav.appendChild(btn);
  });
  const btn = document.createElement("button");
  btn.textContent = "📊 Résumé";
  btn.className = activeTab === "RESUME" ? "active" : "";
  btn.style.color = activeTab === "RESUME" ? "#1B2A4A" : "";
  btn.onclick = () => { activeTab = "RESUME"; render(); };
  nav.appendChild(btn);
}

function renderChildSheet(child){
  const cd = state[child.id];
  const main = document.getElementById("main");
  main.innerHTML = "";

  const infoCard = document.createElement("div");
  infoCard.className = "card";
  infoCard.innerHTML = `
    <label class="field"><span>🏫 Nom de l'école</span>
      <input type="text" value="${escapeHtml(cd.ecole)}" placeholder="Ex : Collège Sainte-Marie" data-field="ecole"/></label>
    <label class="field"><span>📍 Lieu (ville / pays)</span>
      <input type="text" value="${escapeHtml(cd.lieu)}" placeholder="Ex : Abidjan, Côte d'Ivoire" data-field="lieu"/></label>
    <label class="field"><span>Niveau / Classe</span>
      <input type="text" value="${escapeHtml(cd.niveau)}" placeholder="Ex : CM2" data-field="niveau"/></label>
  `;
  infoCard.querySelectorAll("input").forEach(inp => {
    inp.oninput = () => { cd[inp.dataset.field] = inp.value; save(); };
  });
  main.appendChild(infoCard);

  RUBRIQUES.forEach(r => {
    main.appendChild(rubriqueCard(child, r.label, cd.items[r.key], (field, val) => {
      cd.items[r.key][field] = val; save(); updateTotal(child);
    }, true));
  });

  (cd.custom||[]).forEach(row => {
    main.appendChild(rubriqueCard(child, row.label, row, (field, val) => {
      row[field] = val; save(); updateTotal(child);
    }, false, row, child));
  });

  const addBtn = document.createElement("button");
  addBtn.className = "add-btn sans";
  addBtn.textContent = "+ Ajouter une rubrique";
  addBtn.onclick = () => {
    cd.custom = cd.custom || [];
    cd.custom.push({ id:"c"+Date.now(), label:"", montant:"" });
    save(); render();
  };
  main.appendChild(addBtn);

  const totalBox = document.createElement("div");
  totalBox.className = "total-box";
  totalBox.id = "total-box";
  totalBox.style.background = child.soft;
  totalBox.innerHTML = `<span class="sans">Total ${child.name}</span><span class="amount mono" id="total-amount" style="color:${child.accent}">${fmt(childTotal(cd))}</span>`;
  main.appendChild(totalBox);
}

function updateTotal(child){
  const cd = state[child.id];
  const el = document.getElementById("total-amount");
  if(el) el.textContent = fmt(childTotal(cd));
}

function rubriqueCard(child, label, obj, onChange, fixedLabel, rowRef, childRef){
  const card = document.createElement("div");
  card.className = "card";
  const row = document.createElement("div");
  row.className = "rubrique";

  let labelEl;
  if(fixedLabel){
    labelEl = document.createElement("span");
    labelEl.className = "label sans";
    labelEl.textContent = label;
  } else {
    labelEl = document.createElement("input");
    labelEl.type = "text";
    labelEl.className = "sans";
    labelEl.style.flex = "1";
    labelEl.style.border = "none";
    labelEl.style.fontWeight = "600";
    labelEl.placeholder = "Nom de la rubrique";
    labelEl.value = label || "";
    labelEl.oninput = () => onChange("label", labelEl.value);
  }
  row.appendChild(labelEl);

  const amountInp = document.createElement("input");
  amountInp.type = "number";
  amountInp.inputMode = "decimal";
  amountInp.placeholder = "0";
  amountInp.value = obj.montant || "";
  amountInp.oninput = () => onChange("montant", amountInp.value);
  row.appendChild(amountInp);

  if(!fixedLabel){
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.onclick = () => {
      childRef && (state[childRef.id].custom = state[childRef.id].custom.filter(r => r.id !== rowRef.id));
      save(); render();
    };
    row.appendChild(del);
  }
  card.appendChild(row);

  if(fixedLabel){
    const detail = document.createElement("input");
    detail.type = "text";
    detail.className = "detail sans";
    detail.placeholder = "Détail (facultatif)";
    detail.value = obj.detail || "";
    detail.oninput = () => onChange("detail", detail.value);
    card.appendChild(detail);
  }
  return card;
}

function renderResume(){
  const main = document.getElementById("main");
  main.innerHTML = "";
  const grand = CHILDREN.reduce((s,c) => s + childTotal(state[c.id]), 0);

  const gt = document.createElement("div");
  gt.className = "resume-total";
  gt.innerHTML = `<p class="sans">Total général</p><div class="amount mono">${fmt(grand)}</div>`;
  main.appendChild(gt);

  const barsCard = document.createElement("div");
  barsCard.className = "card";
  barsCard.innerHTML = `<p class="sans" style="margin:0 0 10px;font-size:14px;">Répartition par enfant</p>`;
  const max = Math.max(1, ...CHILDREN.map(c => childTotal(state[c.id])));
  CHILDREN.forEach(c => {
    const t = childTotal(state[c.id]);
    const pct = Math.max(3, Math.round((t/max)*100));
    const row = document.createElement("div");
    row.className = "bar-row";
    row.innerHTML = `
      <div class="top sans"><span>${c.name}</span><span class="mono">${fmt(t)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${c.accent}"></div></div>
    `;
    barsCard.appendChild(row);
  });
  main.appendChild(barsCard);

  const tableCard = document.createElement("div");
  tableCard.className = "card";
  let thead = "<tr><th>Rubrique</th>" + CHILDREN.map(c => `<th style="color:${c.accent}">${c.name[0]}</th>`).join("") + "</tr>";
  let rows = RUBRIQUES.map(r => {
    const cells = CHILDREN.map(c => {
      const v = Number(state[c.id].items[r.key]?.montant) || 0;
      return `<td class="mono">${v ? v.toLocaleString("fr-FR") : "–"}</td>`;
    }).join("");
    return `<tr><td class="sans">${r.label}</td>${cells}</tr>`;
  }).join("");
  let tfoot = "<tr><td>Total</td>" + CHILDREN.map(c => `<td class="mono">${childTotal(state[c.id]).toLocaleString("fr-FR")}</td>`).join("") + "</tr>";
  tableCard.innerHTML = `<table><thead>${thead}</thead><tbody>${rows}</tbody><tfoot>${tfoot}</tfoot></table>`;
  main.appendChild(tableCard);

  const note = document.createElement("p");
  note.className = "sans";
  note.style.cssText = "text-align:center;font-size:12px;color:var(--muted);";
  note.textContent = "Montants en FCFA · données enregistrées automatiquement sur cet appareil.";
  main.appendChild(note);
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function resetAll(){
  if(!confirm("Réinitialiser toutes les données du carnet ?")) return;
  state = emptyState();
  save();
  render();
}

function render(){
  renderTabs();
  if(activeTab === "RESUME"){
    renderResume();
  } else {
    const child = CHILDREN.find(c => c.id === activeTab);
    renderChildSheet(child);
  }
}

render();
</script>
</body>
</html>
