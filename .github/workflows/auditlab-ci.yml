name: AuditLab CI

on:
  push:
    paths: ["auditlab/**", ".github/workflows/auditlab-ci.yml"]
  pull_request:
    paths: ["auditlab/**", ".github/workflows/auditlab-ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditlab/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auditlab
          POSTGRES_PASSWORD: auditlab
          POSTGRES_DB: auditlab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auditlab" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      AUDITLAB_DATABASE_URL: postgresql+psycopg://auditlab:auditlab@localhost:5432/auditlab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auditlab/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: auditlab/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: auditlab
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:8080/api/health
      - if: always()
        run: docker compose logs --no-color | tail -100
